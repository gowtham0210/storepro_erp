name: Build Windows installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: StorePro-Setup
          path: dist/*.exe
          if-no-files-found: error
