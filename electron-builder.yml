# Packaging for StorePro. Windows x64 (NSIS installer) is the supported target;
# the Linux `dir` target exists only to test packaging in CI/dev containers.
appId: com.storepro.desktop
productName: StorePro
copyright: Copyright © 2026 StorePro

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!**/*.map'

asar: true

# No update server yet: auto-update and licensing are an open decision (M29).
publish: null

# Electron fuses are flipped in the binary at package time and cannot be
# changed at runtime.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

win:
  executableName: StorePro
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  # M01-09: Code signing configuration.
  # When CSC_LINK / WIN_CSC_LINK (or Azure Trusted Signing / hardware token via
  # scripts/sign-windows.cjs) is configured in the build environment, electron-builder
  # signs StorePro.exe and the NSIS installer with SHA-256 + RFC 3161 timestamp.
  # When no certificate is provided in local/CI test builds, signing is skipped cleanly.
  signAndEditExecutable: true
  verifyUpdateCodeSignature: false
  rfc3161TimeStampServer: http://timestamp.digicert.com
  timeStampServer: http://timestamp.digicert.com
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: StorePro
  runAfterFinish: true
  # Business data lives in %APPDATA%\StorePro and must survive uninstall/upgrade.
  deleteAppDataOnUninstall: false

linux:
  target: dir
